[package]
name = "kiri-engine"
version = "0.1.0"
edition = "2021"
description = "kiri agent engine: a clean-room agentic loop speaking newline-delimited JSON over stdio"
license = "MIT"

[[bin]]
name = "kiri-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "gzip",
  "brotli",
  "deflate",
  "rustls-tls-native-roots",
  "http2",
  "charset",
] }
futures-util = "0.3"
regex = "1"
globset = "0.4"
ignore = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dirs = "6"
walkdir = "2"
serde_yaml = "0.9"
async-trait = "0.1"
once_cell = "1"
tokio-util = "0.7"
shell-words = "1"

[profile.release]
lto = "thin"
strip = true
